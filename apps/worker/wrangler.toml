# cspell:words sass
# Deployed by Cloudflare Workers Builds on push; the account
# comes from the build environment.
name = "srcdex-website"
main = "src/index.ts"
# Pinned to the workerd shipped by @cloudflare/vitest-pool-workers'
# bundled wrangler; raise alongside that dep when it ships a newer
# miniflare.
compatibility_date = "2026-03-17"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_tty_module",
  "enable_nodejs_fs_module",
  "enable_nodejs_http_modules",
  "enable_nodejs_perf_hooks_module",
  "enable_nodejs_v8_module",
  "enable_nodejs_process_v2",
]

# srcdex.dev is temporarily linked to this worker as a
# dashboard-managed custom domain; the domain's final home is
# apptly's sass-dispatcher with go-get-import mounted, so it is
# not declared here. workers.dev is the worker's own address.
workers_dev = true
preview_urls = true

[dev]
ip = "0.0.0.0"
